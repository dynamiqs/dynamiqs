name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # cancel previous runs of this workflow (only for the same pull request, not for main)
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: List installed dependencies
        run: uv pip list

      - name: Run static checks
        run: uv run task check

      - name: Build documentation
        run: uv run task docbuild

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: List installed dependencies
        run: uv pip list

      - name: Run tests (shard ${{ matrix.group }}/5)
        run: uv run task test --splits 5 --group ${{ matrix.group }} --splitting-algorithm least_duration

  doctest-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: List installed dependencies
        run: uv pip list

      - name: Run doctest on code docstrings
        run: uv run task doctest-code

  doctest-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: List installed dependencies
        run: uv pip list

      - name: Run doctest on documentation examples
        run: uv run task doctest-docs

  # TODO: rename this job to something more explicit once we get back admin rights
  build:
    if: always()
    needs: [checks, test, doctest-code, doctest-docs]
    runs-on: ubuntu-latest
    steps:
      - name: Check that all jobs succeeded
        run: |
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "false" ]]
